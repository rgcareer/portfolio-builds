name: CI

# Inert until a git remote exists — this file is committed so CI runs on the first push.
# It runs the same checks used locally: the whole-repo typecheck and the gate.
# No secrets are needed: the gate runs entirely on committed data with mock LLM responders
# (PB_SPEND_CAP_USD defaults to 0, so no real API call is made).
#
# Note: the semantic-cache suite loads a local MiniLM embedding model; on a clean runner the
# first run downloads it from the Hugging Face hub (network, ~90 MB) into a cache.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1): the protocol-frozen audits derive each
          # package's protocol freeze commit from `git log -- packages/<pkg>/protocol`, which only
          # sees commits present in the checkout. Those freezes are 10-35 commits behind HEAD, so a
          # shallow clone reports "protocol not committed" and every protocol-frozen check fails.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Install skillcheck (self-contained nested project)
        run: npm --prefix skillcheck ci
      - name: Typecheck (whole repo)
        run: npx tsc --noEmit
      - name: Gate
        run: npm run gate

# Publishing is intentionally NOT automated. To release the @rgcareer/* packages, run
# `npm publish -w @rgcareer/<pkg> --access public` locally after `npm run gate` is green, or
# uncomment the job below and add an NPM_TOKEN repository secret.
